spring.application.name=budge
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.8
spring.ai.openai.chat.options.response-format.type=TEXT

spring.ai.openai.audio.transcription.option.model=whisper-1
spring.ai.openai.audio.transcription.option.language=pt
spring.ai.openai.audio.transcription.option.temperature=0
spring.ai.openai.audio.transcription.option.response-format=text
spring.ai.openai.audio.transcription.option.prompt=audioo em portugues brasileiro

logging.level.org.springframework.ai=DEBUG

spring.ai.model.audio.speech=openai
spring.ai.openai.audio.speech.options.model=gpt-4o-mini-tts
spring.ai.openai.audio.speech.options.voice=nova
spring.ai.openai.audio.speech.options.speed=1.2
spring.ai.openai.audio.speech.options.response-format=mp3

spring.datasource.url=jdbc:mysql://localhost:3307/transaction
spring.datasource.username=app
spring.datasource.password=app

spring.jpa.hibernate.ddl-auto=update



